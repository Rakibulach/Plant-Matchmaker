<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Plant Store</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Custom JavaScript -->
    <script src="script.js"></script>
</head>

<body>
    <!-- Navbar -->
    <section>
        <nav class="navbar navbar-expand-lg bg-body-tertiary">
            <div class="container-fluid">
                <a class="navbar-brand" href="#"><img class="logo" src="logo.avif" alt=""></a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                    aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item">
                            <a class="nav-link active" aria-current="page" href="index.html">Home</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" aria-current="page" href="product.html">Product</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" aria-current="page" href="about.html">About Us</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" aria-current="page" href="contact.html">Contact Us</a>
                        </li>


                    </ul>
                </div>
            </div>
        </nav>
    </section>

    <!-- Live Chat Section -->
    <section class="container my-5">
        <h2 class="text-center mb-4">Live Chat with a Plant Specialist</h2>

        <div class="card p-4">
            <p><strong>Plant Specialist:</strong> Hello! How can I help you today?</p>

            <div class="mb-3">
                <textarea class="form-control" id="chatMessage" rows="4" placeholder="Type your message..."></textarea>
            </div>

            <button class="btn btn-success" onclick="sendMessage()">Send Message</button>

            <p class="mt-3" id="chatResponse"></p>
        </div>
    </section>

    <!-- Contact Form -->
    <section class="container my-5">
        <h2 class="text-center mb-4">Contact Us</h2>

        <div class="card p-4">

            <p><strong>Email:</strong> bloomingoasis@gmail.com</p>

            <form>

                <div class="mb-3">
                    <label class="form-label">Name</label>
                    <input type="text" class="form-control" id="name">
                </div>

                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" class="form-control" id="email">
                </div>

                <div class="mb-3">
                    <label class="form-label">Message</label>
                    <textarea class="form-control" rows="4" id="message"></textarea>
                </div>

                <button type="button" class="btn btn-success" onclick="submitForm()">
                    Submit
                </button>

            </form>

            <p class="mt-3" id="formResult"></p>

        </div>
    </section>

    <!-- Footer -->
    <footer>
        <p class="mb-0">© 2026 Blooming Oasis. All Rights Reserved.</p>
    </footer>
</body>

</html>
